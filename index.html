  /* ------------------------------------------- editing a list row in place */

  function editBox(t){ return t && t.closest ? t.closest('[data-act="edit-item"]') : null; }

  /* Remember what it said, so Escape has something to go back to. */
  document.addEventListener('focusin', function(e){
    var box = editBox(e.target);
    if(box) box.setAttribute('data-was', box.textContent);
  });

  document.addEventListener('keydown', function(e){
    var box = editBox(e.target);
    if(!box) return;
    if(e.key === 'Enter'){ e.preventDefault(); box.blur(); }
    else if(e.key === 'Escape'){
      e.preventDefault();
      box.setAttribute('data-cancel', '1');
      box.textContent = box.getAttribute('data-was') || '';
      box.blur();
    }
  });

  document.addEventListener('focusout', function(e){
    var box = editBox(e.target);
    if(!box) return;
    var before = box.getAttribute('data-was') || '';
    var text = box.textContent.replace(/\s+/g, ' ').trim();

    if(box.getAttribute('data-cancel')){
      box.removeAttribute('data-cancel');
      box.textContent = before;
      return;
    }
    if(!canEdit || text === before){ box.textContent = before; return; }
    if(!text){
      box.textContent = before;
      toast('An item needs some text, so that was left as it was.', true);
      return;
    }

    var lk = box.getAttribute('data-list'), iid = box.getAttribute('data-id');
    var arr = state.lists[lk] || [];
    var was = arr.map(function(i){
      var c = {}; for(var k in i){ if(i.hasOwnProperty(k)) c[k] = i[k]; } return c;
    });
    var row = arr.filter(function(i){ return i.id === iid; })[0];
    if(!row){ box.textContent = before; return; }

    row.text = text;
    box.textContent = text;
    box.setAttribute('data-was', text);
    /* Repoint the labels that quote the text, without a full repaint, so
       tabbing down a list is not interrupted. */
    var li = box.closest('.prep-item');
    if(li){
      var cb = li.querySelector('input[type="checkbox"]');
      if(cb) cb.setAttribute('aria-label', text);
      var rm = li.querySelector('[data-act="rm-item"]');
      if(rm) rm.setAttribute('aria-label', 'Remove ' + text);
      var cs = li.querySelector('[data-act="setcat"]');
      if(cs) cs.setAttribute('aria-label', 'Category for ' + text);
      box.setAttribute('aria-label', 'Edit ' + text);
    }
    save(function(){ state.lists[lk] = was; }, 'Item updated');
  });

  function save(revert, okMsg){
    function undo(){
      if(typeof revert === 'function') revert();
      render();
    }
    var api = (typeof claude !== 'undefined' && claude && typeof claude.use === 'function') ? claude : null;
    if(!api){
      toast('Saved on this screen only. Reopen the page and this change will be gone.', true);
      return;
    }
    api.use('artifact').then(function(artifact){
      if(!artifact){
        toast('Saved on this screen only. Reopen the page and this change will be gone.', true);
        return;
      }
      return artifact.publish(buildDocument()).then(function(){
        toast(okMsg || 'Saved');
      }, function(err){
        var code = (err && (err.code || err.name)) || '';
        if(code === 'conflict'){
          toast('Someone else saved first. This page is reloading to their version.', true);
          return;
        }
        if(code === 'not_granted' || code === 'not_writer'){
          canEdit = false;
          rememberEditor(false);
          undo();
          toast('You have view access only, so that change was not saved.', true);
          return;
        }
        undo();
        toast('That did not save. Try again in a moment.', true);
      });
    }).catch(function(){
      undo();
      toast('That did not save. Try again in a moment.', true);
    });
  }

  /* ------------------------------------------------------------------ chrome */

  function toast(msg, warn){
    var box = document.getElementById('toast');
    var el = document.createElement('div');
    el.className = 'toast' + (warn ? ' warn' : '');
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(function(){ el.remove(); }, warn ? 6000 : 3000);
  }

  function zoom(src){
    var lb = document.createElement('div');
    lb.className = 'lightbox';
    lb.id = 'lightbox';
    lb.innerHTML = '<img src="' + esc(src) + '" alt="">';
    lb.addEventListener('click', function(){ lb.remove(); });
    document.body.appendChild(lb);
  }

  document.addEventListener('click', function(e){
    var img = e.target.closest('img[data-act="zoom"]');
    if(img){ zoom(img.getAttribute('src')); return; }

    var btn = e.target.closest('[data-act]');
    if(!btn) return;
    var act = btn.getAttribute('data-act');

    if(act === 'tab'){
      var tid = btn.getAttribute('data-tab');
      if(activeTab === tid) return;
      activeTab = tid;      /* view state only, never published */
      rememberTab(tid);
      render();
      window.scrollTo({top:0, behavior:'auto'});
      return;
    }
    if(act === 'tabscroll'){
      var strip = document.getElementById('tabstrip');
      if(strip){
        var step = Math.max(120, Math.round(strip.clientWidth * 0.7));
        strip.scrollLeft += step * (btn.getAttribute('data-dir') === '1' ? 1 : -1);
      }
      return;
    }
    if(act === 'unlock'){ tryUnlock(); return; }
    if(act === 'lock'){
      /* A look, not a downgrade: the stored editor flag is left alone so
         coming back is one click and never another publish. */
      previewing = true;
      canEdit = false;
      render();
      window.scrollTo({top:0, behavior:'auto'});
      toast('This is what family sees. Choose Back to editing to come back.');
      return;
    }
    if(act === 'endpreview'){
      previewing = false;
      canEdit = true;
      activeTab = lastTab();
      render();
      return;
    }
    if(act === 'sharing'){ openSharing(); return; }
    if(act === 'dl-json'){
      if(!canEdit) return;   /* nothing downloadable in the family view */
      offerDownload(slug() + '.json', JSON.stringify(state, null, 2));
      return;
    }
    if(act === 'dl-html'){
      if(!canEdit) return;
      offerDownload(slug() + '.html', buildDocument());
      return;
    }
    if(act === 'rm-item'){
      var lk = btn.getAttribute('data-list'), iid = btn.getAttribute('data-id');
      var was = (state.lists[lk] || []).slice();
      state.lists[lk] = was.filter(function(i){ return i.id !== iid; });
      render();
      save(function(){ state.lists[lk] = was; }, 'Removed');
      return;
    }
    if(act === 'new'){ openForm(null); }
    else if(act === 'edit'){ openForm(btn.getAttribute('data-id')); }
    else if(act === 'del'){
      var id = btn.getAttribute('data-id');
      var before = state.items.slice();
      state.items = state.items.filter(function(i){ return i.id !== id; });
      render();
      save(function(){ state.items = before; }, 'Entry removed');
    }
    else if(act === 'palette'){
      var pid = btn.getAttribute('data-p');
      if(PALETTE_IDS.indexOf(pid) === -1 || state.trip.theme === pid) return;
      var prevTheme = state.trip.theme;
      state.trip.theme = pid;
      render();
      save(function(){ state.trip.theme = prevTheme; },
           (PALETTES.filter(function(p){ return p.id === pid; })[0] || {}).label + ' applied');
    }
    else if(act === 'clear-seed'){
      var prev = state.items.slice();
      state.items = state.items.filter(function(i){ return !/^seed-/.test(i.id); });
      render();
      save(function(){ state.items = prev; }, 'Examples cleared');
    }
  });

  document.addEventListener('change', function(e){
    var sel = e.target.closest ? e.target.closest('[data-act="setcat"]') : null;
    if(sel && canEdit){
      var slk = sel.getAttribute('data-list'), sid = sel.getAttribute('data-id');
      var arr = state.lists[slk] || [];
      var prev = arr.map(function(i){ return {id:i.id, text:i.text, done:i.done, cat:i.cat}; });
      var row = arr.filter(function(i){ return i.id === sid; })[0];
      if(!row) return;
      var sl = LIST_MAP[slk] || {catMap:{}};
      var next = sl.catMap[sel.value] ? sel.value : '';
      if(next === row.cat) return;
      row.cat = next;
      if(next) lastCat[slk] = next;
      render();
      save(function(){ state.lists[slk] = prev; },
           'Moved to ' + (next ? sl.catMap[next].label : 'Not sorted'));
      return;
    }

    var rate = e.target.closest ? e.target.closest('[data-act="rate"]') : null;
    if(rate && canEdit){
      var cur = rate.getAttribute('data-cur');
      var prev = JSON.parse(JSON.stringify(state.rates || {}));
      var n = parseFloat(rate.value.replace(/\s/g, '').replace(',', '.'));
      if(isFinite(n) && n > 0) state.rates[cur] = String(n);
      else delete state.rates[cur];
      render();
      save(function(){ state.rates = prev; },
           state.rates[cur] ? cur + ' rate saved' : cur + ' rate cleared');
      return;
    }

    var box = e.target.closest ? e.target.closest('[data-act="tick"]') : null;
    if(!box || !canEdit) return;
    var lk = box.getAttribute('data-list'), iid = box.getAttribute('data-id');
    var items = state.lists[lk] || [];
    var was = items.map(function(i){
      var c = {}; for(var k in i){ if(i.hasOwnProperty(k)) c[k] = i[k]; } return c;
    });
    var hit = items.filter(function(i){ return i.id === iid; })[0];
    if(!hit) return;
    hit.done = box.checked;
    render();
    save(function(){ state.lists[lk] = was; }, hit.done ? 'Ticked off' : 'Back on the list');
  });

  document.addEventListener('submit', function(e){
    var form = e.target;
    if(!form.classList || !form.classList.contains('prep-add')) return;
    e.preventDefault();
    if(!canEdit) return;
    var lk = form.getAttribute('data-list');
    var input = form.querySelector('input');
    var text = input.value.trim();
    if(!text) return;
    var catSel = form.querySelector('.prep-cat');
    var row = {id: uid(), text: text, done: false};
    if(catSel){
      var al = LIST_MAP[lk] || {catMap:{}};
      row.cat = al.catMap[catSel.value] ? catSel.value : '';
      if(row.cat) lastCat[lk] = row.cat;
    }
    var was = (state.lists[lk] || []).slice();
    state.lists[lk] = was.concat([row]);
    render();
    /* put the cursor back so a run of items can be typed without re-clicking */
    var again = document.querySelector('.prep-add[data-list="' + lk + '"] input');
    if(again) again.focus();
    save(function(){ state.lists[lk] = was; }, 'Added');
  });

  document.addEventListener('blur', function(e){
    var el = e.target;
    if(!el || el.id !== 'trip-name') return;
    var name = el.textContent.trim() || 'Our Trip';
    if(name === state.trip.name) return;
    var prevName = state.trip.name;
    state.trip.name = name;
    save(function(){ state.trip.name = prevName; }, 'Trip name saved');
  }, true);

  document.addEventListener('keydown', function(e){
    if(e.target && e.target.id === 'trip-name' && e.key === 'Enter'){
      e.preventDefault();
      e.target.blur();
    }
  });

  render();
})();
</script>
