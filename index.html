  --line:#283534; --line-strong:#3A4A48;

  --accent:#57C4B8; --accent-ink:#8AD9CF; --accent-soft:#123330; --on-accent:#07201D;

  --t-transport:#9AB4BD; --t-transport-bg:#1B2A2E;
  --t-stay:#B7A0E2;      --t-stay-bg:#241E36;
  --t-food:#DFA764;      --t-food-bg:#33260F;
  --t-activity:#4FB3A8;  --t-activity-bg:#123330;

  --line:#2E3F3D; --line-strong:#4F5B5A;

  --t-food:#E489A3; --t-food-bg:#3C383B;

*{box-sizing:border-box}
/* Paint the ground on the root as well as the body. A body-only background is
   propagated to the canvas, and in light mode that left the page white. */
html{background:var(--bg)}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:920px;margin:0 auto;padding:32px 20px 96px}
h1,h2,h3{text-wrap:balance;margin:0}
a{color:var(--accent-ink)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- masthead ---------- */
.mast{display:flex;flex-direction:column;gap:14px;padding-bottom:22px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.mast-eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mast-title{font-family:var(--f-display);font-size:clamp(38px,7vw,60px);line-height:1.02;letter-spacing:-.01em;font-weight:400}
.mast-title[contenteditable]:focus{outline:none;background:var(--accent-soft);border-radius:6px}
.mast-meta{display:flex;flex-wrap:wrap;gap:8px 22px;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mast-meta b{color:var(--ink-2);font-weight:500}

/* ---------- tabs ---------- */
/* The strip scrolls sideways, so each edge that has more tabs behind it gets
   a fade and an arrow. Both are switched on from script, never guessed. */
.tabwrap{position:relative;margin-top:16px}
.tabwrap::before,.tabwrap::after{
  content:"";position:absolute;top:0;bottom:1px;width:56px;pointer-events:none;
  opacity:0;transition:opacity .15s;z-index:1;
}
.tabwrap::before{left:0;background:linear-gradient(to right,var(--bg) 34%,transparent)}
.tabwrap::after{right:0;background:linear-gradient(to left,var(--bg) 34%,transparent)}
.tabwrap.more-l::before,.tabwrap.more-r::after{opacity:1}
.tabnav{
  position:absolute;top:50%;transform:translateY(-50%);z-index:2;
  display:none;align-items:center;justify-content:center;
  width:26px;height:26px;padding:0;border-radius:999px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line-strong);color:var(--ink-2);
  box-shadow:0 1px 4px rgba(0,0,0,.14);
}
.tabnav svg{width:13px;height:13px}
.tabnav:hover{color:var(--accent-ink);border-color:var(--accent)}
.tn-l{left:0}
.tn-r{right:0}
.tabwrap.more-l .tn-l,.tabwrap.more-r .tn-r{display:flex}
.tabs{
  display:flex;gap:2px;border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
}
.tabs::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){.tabs{scroll-behavior:auto}}
.tab{
  background:none;border:0;margin-bottom:-1px;border-radius:8px 8px 0 0;
  padding:11px 14px;cursor:pointer;flex:0 0 auto;white-space:nowrap;
  font-family:var(--f-mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);transition:color .15s, background .15s;
}
.tab:hover{color:var(--ink)}
/* The selected tab is filled rather than underlined. `--on-accent` is the
   ink each palette pairs with its own accent, so it stays readable when the
   accent goes bright in dark mode. */
.tab[aria-selected="true"]{
  background:var(--accent);color:var(--on-accent);font-weight:600;
}
.tab[aria-selected="true"]:hover{background:var(--accent);color:var(--on-accent)}
.tab-count{margin-left:8px;opacity:.6;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"] .tab-count{opacity:.72}

/* ---------- toolbar ---------- */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 0 22px}
.bar-spacer{flex:1}
.palettes{display:flex;gap:7px;align-items:center}
.palettes-label{font-family:var(--f-mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.sw{
  width:20px;height:20px;border-radius:50%;padding:0;cursor:pointer;
  border:1px solid var(--line-strong);
  background:linear-gradient(135deg,var(--sw-a) 0 50%,var(--sw-b) 50% 100%);
  transition:transform .12s;
}
.sw:hover{transform:scale(1.12)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.sw-sorbet{--sw-a:#D12258;--sw-b:#67C0AC}
.sw-teal{--sw-a:#0B6E67;--sw-b:#141D1C}
.sw-orchid{--sw-a:#8F5772;--sw-b:#122F2A}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--surface);border:1px solid var(--line-strong);
  padding:8px 14px;border-radius:var(--radius);cursor:pointer;
  font-size:14px;font-weight:500;color:var(--ink-2);
  transition:border-color .15s,background .15s;
}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn-primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);color:var(--on-accent)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 9px}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn svg{width:15px;height:15px;flex:none}

/* ---------- day ---------- */
.day{display:grid;grid-template-columns:88px 1fr;gap:0 22px;padding:30px 0 6px;border-bottom:1px solid var(--line)}
.day:last-of-type{border-bottom:none}
.day-mark{position:sticky;top:16px;align-self:start;padding-top:2px}
.day-num{font-family:var(--f-display);font-size:42px;line-height:.9;color:var(--accent-ink)}
.day-mon{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.day-dow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.day-items{display:flex;flex-direction:column;gap:2px;min-width:0}

/* ---------- entry ---------- */
.entry{display:grid;grid-template-columns:74px 1fr;gap:0 18px;padding:14px 0;border-top:1px solid var(--line);min-width:0}
.day-items>.entry:first-child{border-top:none}
.entry-time{
  font-family:var(--f-mono);font-size:13.5px;font-variant-numeric:tabular-nums;
  color:var(--accent-ink);padding-top:3px;letter-spacing:-.02em;
  display:flex;flex-direction:column;align-items:flex-start;
}
.entry-time.none{color:var(--muted)}
.t-rule{display:block;width:1px;height:9px;background:var(--line-strong);margin:2px 0 2px 3px}
.t-end{color:var(--muted);font-size:12.5px}
.t-next{font-size:9.5px;vertical-align:super;margin-left:1px;letter-spacing:0;color:var(--t-food)}
.t-zone{
  display:block;font-size:9.5px;letter-spacing:.08em;color:var(--muted);
  line-height:1.5;font-weight:500;
}
.entry-body{min-width:0;display:flex;flex-direction:column;gap:7px}
.entry-head{display:flex;gap:10px;align-items:flex-start}
.entry-title{font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.3;flex:1;min-width:0;word-wrap:break-word}
.entry-acts{display:flex;gap:2px;opacity:0;transition:opacity .15s}
.entry:hover .entry-acts,.entry:focus-within .entry-acts{opacity:1}
@media (hover:none){.entry-acts{opacity:1}}
.entry-notes{color:var(--ink-2);font-size:14.5px;white-space:pre-wrap;word-wrap:break-word}
.entry-facts{
  display:flex;flex-wrap:wrap;align-items:baseline;
  font-family:var(--f-mono);font-size:12px;color:var(--ink-2);
  letter-spacing:.01em;
}
.fact{display:inline-flex;align-items:baseline}
.fact-k{color:var(--muted);margin-right:6px}
.fact-strong{font-size:13.5px;font-weight:500;color:var(--ink)}
.entry-facts-block{display:block;line-height:1.55}
/* Stacked fact lines read as one block, so they sit tighter than the
   7px the entry body puts between its other parts. */
.entry-facts + .entry-facts{margin-top:-4px}
.amen-chips{margin-top:1px}
.fact + .fact::before{
  content:"·";color:var(--line-strong);margin:0 8px;font-weight:700;
}

.entry-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.pin,.kind{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--accent-soft);color:var(--accent-ink);
  padding:4px 10px 4px 8px;border-radius:999px;
  font-size:13px;font-weight:500;text-decoration:none;max-width:100%;
}
.pin{transition:filter .15s}
.pin:hover{filter:brightness(.95);text-decoration:underline}
.pin svg,.kind svg{width:13px;height:13px;flex:none}
.pin span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kind{
  font-family:var(--f-mono);font-size:10.5px;font-weight:500;
  letter-spacing:.11em;text-transform:uppercase;
  padding:4px 10px 4px 7px;
  background:var(--kind-bg);color:var(--kind-fg);
}
.kind-sub{
  display:inline-flex;align-items:center;
  margin-left:1px;padding-left:7px;
  border-left:1px solid currentColor;
  opacity:.72;
}
.k-flight{--kind-fg:var(--t-flight);--kind-bg:var(--t-flight-bg)}
.k-transport{--kind-fg:var(--t-transport);--kind-bg:var(--t-transport-bg)}
.k-stay{--kind-fg:var(--t-stay);--kind-bg:var(--t-stay-bg)}
.k-food{--kind-fg:var(--t-food);--kind-bg:var(--t-food-bg)}
.k-activity{--kind-fg:var(--t-activity);--kind-bg:var(--t-activity-bg)}
.k-free{--kind-fg:var(--t-free);--kind-bg:var(--t-free-bg)}
.k-other{--kind-fg:var(--t-other);--kind-bg:var(--t-other-bg)}
select{
  width:100%;font:inherit;font-size:15px;color:var(--ink);
  background:var(--bg);border:1px solid var(--line-strong);
  border-radius:8px;padding:9px 11px;
}
select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.shots{display:flex;gap:8px;flex-wrap:wrap;padding-top:2px}
.shots img{
  width:104px;height:78px;object-fit:cover;border-radius:8px;
  border:1px solid var(--line);background:var(--surface-2);cursor:zoom-in;display:block;
}

/* ---------- today ---------- */
.mast-status{
  align-self:flex-start;margin-top:-4px;
  font-family:var(--f-mono);font-size:12.5px;
  color:var(--on-accent);background:var(--accent);
  padding:3px 11px;border-radius:999px;font-weight:600;letter-spacing:.02em;
}
.mast-status.s-after{background:var(--surface-2);color:var(--muted)}
.day-today{position:relative}
.day-today::before{
  content:"";position:absolute;left:-16px;top:22px;bottom:6px;width:3px;
  border-radius:2px;background:var(--accent);
}
.day-today .day-num{color:var(--accent)}
.day-today-tag{
  margin-top:8px;display:inline-block;
  background:var(--accent);color:var(--on-accent);
  padding:2px 8px;border-radius:999px;
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
}

/* ---------- budget ----------
   A table with a meter per row. Currencies are never summed, so each gets its
   own card and its own 100%. One hue throughout: this is magnitude, not identity. */
.budget{gap:0;padding-bottom:18px}
.bud-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding-bottom:14px;margin-bottom:16px;border-bottom:2px solid var(--ink);
}
.bud-cur{
  font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);
}
.bud-total{
  font-family:var(--f-display);font-size:34px;line-height:1;color:var(--ink);
  font-variant-numeric:tabular-nums;
}
.bud-block + .bud-block{margin-top:16px}
.bud-row{display:flex;align-items:baseline;gap:10px;font-size:14.5px}
.bud-name{flex:1;min-width:0;font-weight:600;letter-spacing:-.01em}
.bud-amt{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}
.bud-pct{
  font-family:var(--f-mono);font-size:11px;color:var(--muted);
  font-variant-numeric:tabular-nums;flex:0 0 34px;text-align:right;
}

.card{

  /* Amounts are grouped the European way (1 200,50) and never converted;
     a made-up exchange rate would be worse than showing each currency. */
  function fmtAmount(v){
    var n = parseFloat(String(v).replace(/\s/g, '').replace(',', '.'));
    if(!isFinite(n)) return String(v);
    var cents = Math.abs(n % 1) > 0.0001;
    try{
      return new Intl.NumberFormat('sv-SE', {
        minimumFractionDigits: cents ? 2 : 0,
        maximumFractionDigits: cents ? 2 : 0
      }).format(n);
    }catch(e){
      return String(n);
    }
  }

    var f = fieldsFor(typeId).filter(function(x){ return x.money; })[0];

    var by = {}, order = [];
    items.forEach(function(i){
      var d = i.details || {};
      var raw = d[f.id];
      if(!raw) return;
      var n = parseFloat(String(raw).replace(/\s/g, '').replace(',', '.'));
      if(!isFinite(n)) return;
      var cur = d[f.curField] || '';
      if(by[cur] == null){ by[cur] = 0; order.push(cur); }
      by[cur] += n;
    });
    return order.map(function(c){ return fmtMoney(by[c], c); });

  function validZone(tz){
    if(!tz || typeof tz !== 'string') return false;
    try{ new Intl.DateTimeFormat('en-GB', {timeZone: tz}); return true; }
    catch(e){ return false; }
  }

  /* Short label for a zone on a given date, e.g. CET, CEST, GMT+8. */
  var zoneCache = {};
  function zoneLabel(tz, iso){
    if(!tz) return '';
    var key = tz + '|' + (iso || '');
    if(zoneCache[key]) return zoneCache[key];
    var out = tz;
    try{
      var d = parseDate(iso) || new Date(Date.UTC(2026, 0, 1));
      var parts = new Intl.DateTimeFormat('en-GB', {timeZone: tz, timeZoneName: 'short'}).formatToParts(d);
      for(var i = 0; i < parts.length; i++){
        if(parts[i].type === 'timeZoneName'){ out = parts[i].value; break; }
      }
    }catch(e){
      out = tz.split('/').pop().replace(/_/g, ' ');
    }
    zoneCache[key] = out;
    return out;
  }

  /* How far a zone is from UTC at a given instant, in minutes. Read back off
     Intl rather than guessed, so summer time is handled by the browser. */
  function zoneOffset(utcMs, tz){
    var p = {};
    new Intl.DateTimeFormat('en-GB', {
      timeZone: tz, hour12: false,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    }).formatToParts(new Date(utcMs)).forEach(function(x){ p[x.type] = x.value; });
    var asUTC = Date.UTC(+p.year, +p.month - 1, +p.day,
                         p.hour === '24' ? 0 : +p.hour, +p.minute, +p.second);
    return (asUTC - utcMs) / 60000;
  }

  /* A wall clock reading in one zone turned into a real instant. The offset
     depends on the instant we are solving for, so it is applied twice. */
  function zonedInstant(iso, hhmm, tz, dayShift){
    if(!iso || !hhmm) return null;
    var dp = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
    var tp = /^(\d{1,2}):(\d{2})$/.exec(hhmm);
    if(!dp || !tp) return null;
    var wall = Date.UTC(+dp[1], +dp[2] - 1, +dp[3] + (dayShift || 0), +tp[1], +tp[2]);
    if(!validZone(tz)) return wall;
    try{
      var t = wall - zoneOffset(wall, tz) * 60000;
      return wall - zoneOffset(t, tz) * 60000;
    }catch(e){ return wall; }
  }

  /* Elapsed minutes between an entry's start and end, across time zones.
     An end that reads earlier on the clock than the start is the next day,
     which is the same rule the rest of the page uses. */
  function elapsedMinutes(iso, start, startTz, end, endTz){
    if(!iso || !start || !end) return null;
    var ez = endTz || startTz;
    var a = zonedInstant(iso, start, startTz, 0);
    var z = zonedInstant(iso, end, ez, end < start ? 1 : 0);
    if(a == null || z == null) return null;
    var min = Math.round((z - a) / 60000);
    return (min >= 0 && min < 60 * 24 * 14) ? min : null;
  }

    return elapsedMinutes(it.date, it.time, it.tz, it.endTime, it.endTz);

  }

  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function uid(){ return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function parseDate(iso){
    var p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    if(!p) return null;
    return new Date(Date.UTC(+p[1], +p[2]-1, +p[3]));
  }
  function longDate(iso){
    var d = parseDate(iso);
    if(!d) return 'No date';
    return DOW[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
  }

  function sorted(){
    return state.items.slice().sort(function(a,b){
      var d = (a.date||'9999').localeCompare(b.date||'9999');
      if(d) return d;
      var at = a.time || '99:99', bt = b.time || '99:99';
      return at.localeCompare(bt);
    });
  }

  function grouped(){
    var out = [], last = null;
    sorted().forEach(function(it){
      if(!last || last.date !== (it.date||'')){
        last = {date: it.date||'', items:[]};
        out.push(last);
      }
      last.items.push(it);
    });
    return out;
  }

  function stateBytes(){
    return new Blob([JSON.stringify(state)]).size;
  }

  var ICON = {
    plus:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>',
    pin:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 14.5s5-4.2 5-7.6A5 5 0 0 0 3 6.9c0 3.4 5 7.6 5 7.6Z"/><circle cx="8" cy="6.8" r="1.9"/></svg>',
    edit:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M11.3 2.6a1.6 1.6 0 0 1 2.3 2.3l-7.4 7.4-3 .7.7-3Z"/></svg>',
    trash:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.2h5.8l.6-8.2"/></svg>',
    info:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" style="width:15px;height:15px;flex:none;margin-top:2px"><circle cx="8" cy="8" r="6.2"/><path d="M8 7.2v4M8 4.9v.1" stroke-linecap="round"/></svg>',
    share:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="3.6" r="1.9"/><circle cx="4" cy="8" r="1.9"/><circle cx="12" cy="12.4" r="1.9"/><path d="M5.7 7.1 10.3 4.5M5.7 8.9l4.6 2.6"/></svg>',
    down:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.4v7.4M5.1 7.1 8 10l2.9-2.9M2.9 12.4h10.2"/></svg>',
    unlock:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="3.2" y="7.2" width="9.6" height="6.6" rx="1.6"/><path d="M5.6 7.2V5.1a2.4 2.4 0 0 1 4.7-.6" stroke-linecap="round"/></svg>',
    chevL:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.2 5.2 8l4.8 4.8"/></svg>',
    chevR:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.2 10.8 8 6 12.8"/></svg>'
  };

  function typeIcon(t){
    return '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" ' +
           'stroke-linejoin="round" aria-hidden="true">' + t.icon + '</svg>';
  }

  function mapsUrl(q){
    return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
  }

  /* ------------------------------------------------------------------ render */

  /* Accommodation entries in order, with each stay's length worked out from
     the next stay's date (or the trip's last date for the final one). */
  function stayStops(){
    var dated = sorted().filter(function(i){ return i.date; });
    var lastDate = dated.length ? dated[dated.length - 1].date : '';
    var stays = sorted().filter(function(i){ return i.type === 'stay'; });
    return stays.map(function(s, idx){
      var nextStay = stays[idx + 1];
      var out = nextStay ? nextStay.date : lastDate;
      var nights = 0;
      if(s.date && out && out > s.date){
        var a = parseDate(s.date), z = parseDate(out);
        if(a && z) nights = Math.round((z - a) / 86400000);
      }
      return {item:s, from:s.date, to:(nights ? out : ''), nights:nights};
    });
  }

  /* Today in the viewer's own calendar, as a plain yyyy-mm-dd string. */
  function todayISO(){
    var d = new Date();
    return d.getFullYear() + '-' +
           String(d.getMonth() + 1).padStart(2, '0') + '-' +
           String(d.getDate()).padStart(2, '0');
  }

  function daysBetween(a, b){
    var x = parseDate(a), y = parseDate(b);
    if(!x || !y) return null;
    return Math.round((y - x) / 86400000);
  }

  /* Where the trip sits relative to today: before it, inside it, or past. */
  function tripStatus(){
    var dated = sorted().filter(function(i){ return i.date; });
    if(!dated.length) return null;
    var first = dated[0].date, last = dated[dated.length - 1].date;
    var today = todayISO();
    var span = (daysBetween(first, last) || 0) + 1;
    if(today < first){
      var n = daysBetween(today, first);
      return {phase:'before', text: n === 1 ? 'starts tomorrow' : 'starts in ' + n + ' days'};
    }
    if(today > last){
      var m = daysBetween(last, today);
      return {phase:'after', text: m === 1 ? 'ended yesterday' : 'ended ' + m + ' days ago'};
    }
    return {phase:'during', text:'day ' + ((daysBetween(first, today) || 0) + 1) + ' of ' + span, today:today};
  }

  function shortDate(iso){
    var d = parseDate(iso);
    if(!d) return '';
    return DOW[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()];
  }

  /* "Mon 2 Nov  ·  07:15 CET to 04:30 GMT+8" */
  /* Types where the gap between departure and arrival is the point. */
  var ELAPSED_TYPES = {flight:1, transport:1};

  function whenLine(it){
    var parts = [];
    if(it.date) parts.push(shortDate(it.date));
    if(it.time){
      var showZ = zonesInUse().length > 1;
      var s = it.time + (showZ ? ' ' + zoneLabel(it.tz, it.date) : '');
      if(it.endTime){
        var ez = it.endTz || it.tz;
        s += ' to ' + it.endTime + (showZ ? ' ' + zoneLabel(ez, it.date) : '');
      }
      parts.push(s);
    }
    /* Travel legs get the elapsed time worked out for them; for anything else
       the two clock readings already say it. */
    if(ELAPSED_TYPES[it.type]){
      var dur = fmtDuration(entryElapsed(it));
      if(dur) parts.push(dur);
    }
    return parts.join('  ·  ');
  }

  function subCounts(items, typeId){
    var m = {}, order = [];
    items.forEach(function(i){
      var l = subLabel(typeId, i.subtype);
      if(!l) return;
      if(m[l] == null){ m[l] = 0; order.push(l); }
      m[l]++;
    });
    return order.map(function(l){ return {label:l, n:m[l]}; })
                .sort(function(a, b){ return b.n - a.n; });
  }

  /* One overview tab. Every type uses the same card; Stays adds the nights
     it works out from when the next stay begins. */
  function renderOverview(tab){
    var items = sorted().filter(function(i){ return i.type === tab.type; });
    var t = TYPE_MAP[tab.type];

    if(!items.length){
      return '<div class="empty"><h2>No ' + esc(tab.empty) + ' yet</h2>' +
             '<p>Entries you set to ' + esc(t.label) + ' collect here, with their times and details side by side.</p>' +
             (canEdit ? '<button class="btn btn-primary" data-act="new">' + ICON.plus + 'Add an entry</button>' : '') +
             '</div>';
    }

    var stopBy = {};
    if(tab.type === 'stay') stayStops().forEach(function(s){ stopBy[s.item.id] = s; });

    var bits = [items.length + ' ' + (items.length === 1 ? tab.noun : tab.nouns)];
    if(tab.type === 'stay'){
      var nights = 0, bfast = 0;
      items.forEach(function(i){
        var st = stopBy[i.id];
        if(st) nights += st.nights;
        if(i.details && i.details.breakfast) bfast++;
      });
      if(nights) bits.push(nights + (nights === 1 ? ' night' : ' nights'));
      if(bfast) bits.push(bfast + ' with breakfast');
      costTotals(items, tab.type).forEach(function(t){ bits.push(t); });
    } else {
      subCounts(items, tab.type).slice(0, 3).forEach(function(c){
        bits.push(c.n + ' ' + c.label.toLowerCase());
      });
      /* Time in transit across the whole tab, from the legs that have both
         a departure and an arrival on them. */
      if(ELAPSED_TYPES[tab.type]){
        var mins = 0, timed = 0;
        items.forEach(function(i){
          var m = entryElapsed(i);
          if(m != null){ mins += m; timed++; }
        });
        var word = tab.type === 'flight' ? ' in the air' : ' in transit';
        if(mins) bits.push(fmtDuration(mins) + word +
                           (timed < items.length ? ' over ' + timed + ' of ' + items.length : ''));
      }
      costTotals(items, tab.type).forEach(function(t){ bits.push(t); });
    }

    var html = '<div class="card-sum">' + esc(bits.join('  ·  ')) + '</div><div class="cards">';

    items.forEach(function(it){
      var d = it.details || {};
      var fields = fieldsFor(it.type);
      var headline = fields.filter(function(f){ return f.headline && d[f.id]; })[0];
      var name = headline ? d[headline.id] : it.title;
      var sub = subLabel(it.type, it.subtype);
      var stop = stopBy[it.id];

      html += '<article class="card">';
      html +=   '<div class="card-head"><div class="card-top">';
      html +=     '<h3 class="card-name">' + esc(name) + '</h3>';
      if(canEdit){
        html +=   '<button class="btn btn-ghost" data-act="edit" data-id="' + esc(it.id) + '"' +
                  ' aria-label="Edit ' + esc(name) + '">' + ICON.edit + '</button>';
      }
      html +=   '</div>';

      var when = whenLine(it);
      if(stop && stop.from){
        when = shortDate(stop.from) + (stop.to ? ' to ' + shortDate(stop.to) : '');
      }
      if(when || (stop && stop.nights)){
        html += '<div class="card-when">' + esc(when || 'No date set') +
                (stop && stop.nights
                  ? '<span class="card-nights">' + stop.nights + (stop.nights === 1 ? ' night' : ' nights') + '</span>'
                  : '') + '</div>';
      }
      if(headline && it.title !== name){
        html += '<div class="card-sub">' + esc(it.title) + '</div>';
      }
      html +=   '</div>';

      /* What it is and where it is belong together on one row; the amenity
         badges are a different kind of fact, so they get the row below. */
      var chips = '';
      if(sub) chips += '<span class="kind k-' + esc(it.type) + '">' + typeIcon(t) + esc(sub) + '</span>';
      if(it.location){
        chips += '<a class="pin" href="' + esc(mapsUrl(it.location)) + '" target="_blank" rel="noopener noreferrer">' +
                 ICON.pin + '<span>' + esc(it.location) + '</span></a>';
      }
      if(chips) html += '<div class="entry-chips">' + chips + '</div>';

      var amen = '';
      fields.forEach(function(f){
        /* A tick box that carries its own hours reads as a value, not a badge,
           so it goes in the table with the other times instead. */
        if(f.input !== 'checkbox' || f.cardRow || !d[f.id]) return;
        if(f.private && !canEdit) return;
        amen += '<span class="kind k-' + esc(f.chip || it.type) + '">' + esc(f.label) + '</span>';
      });
      if(amen) html += '<div class="entry-chips card-amen">' + amen + '</div>';

      var rows = '', blocks = '';
      fields.slice().map(function(f, i){ return {f:f, o:(f.disp == null ? i : f.disp)}; })
        .sort(function(a, b){ return a.o - b.o; })
        .map(function(x){ return x.f; })
        .forEach(function(f){
        var v = d[f.id];
        if(!v || f.quiet || (headline && f.id === headline.id)) return;
        if(f.private && !canEdit) return;
        if(f.input === 'checkbox'){
          /* A tick box with its own hours belongs with the other times. */
          if(!f.cardRow) return;
          var a = d[f.span ? f.span[0] : ''], z = d[f.span ? f.span[1] : ''];
          var val = (a && z) ? (a + ' to ' + z)
                  : a ? ('from ' + a)
                  : z ? ('until ' + z)
                  : (f.spanEmpty || '');
          /* Ticked with no hours and nothing sensible to say: leave the row out. */
          if(!val) return;
          rows += '<span class="fact-k">' + esc(f.prefix || f.label) + '</span><span>' + esc(val) + '</span>';
          return;
        }
        if(f.block){
          blocks += '<div class="card-block">' + esc(v) + '</div>';
        } else {
          var shown = f.money ? fmtMoney(v, d[f.curField]) : v;
          rows += '<span class="fact-k">' + esc(f.prefix || f.label) + '</span><span>' + esc(shown) + '</span>';
        }
      });
      if(rows)   html += '<div class="card-lines">' + rows + '</div>';
      if(blocks) html += blocks;
      if(it.notes) html += '<div class="card-note">' + esc(it.notes) + '</div>';

      html += '</article>';
    });

    return html + '</div>';
  }

  function moneyField(typeId){
    return fieldsFor(typeId).filter(function(f){ return f.money; })[0] || null;
  }

  function amountOf(it){
    var f = moneyField(it.type);
    if(!f) return null;
    var raw = (it.details || {})[f.id];
    if(!raw) return null;
    var n = parseFloat(String(raw).replace(/\s/g, '').replace(',', '.'));
    return isFinite(n) ? {n:n, cur:(it.details[f.curField] || '')} : null;
  }

  var HOME_CUR = 'SEK';

  /* Rates are entered as "how many of this currency you get for 1 SEK",
     so converting back to SEK divides. */
  function rateFor(cur){
    if(!cur) return null;
    if(cur === HOME_CUR) return 1;
    var r = parseFloat(String((state.rates || {})[cur] || '').replace(/\s/g, '').replace(',', '.'));
    return (isFinite(r) && r > 0) ? r : null;
  }

  function toHome(n, cur){
    var r = rateFor(cur);
    return r ? n / r : null;
  }

  function pricedCount(){
    return state.items.filter(function(i){ return amountOf(i); }).length;
  }

  /* Costs rolled up per currency, then per type, then per subtype. Currencies
     are never added together, so each gets its own total and its own shares. */
  function budgetData(){
    var order = TABS.filter(function(t){ return t.type; }).map(function(t){ return t.type; });
    var curs = {}, curOrder = [];
    var counts = {};

    state.items.forEach(function(it){
      if(!moneyField(it.type)) return;
      if(!counts[it.type]) counts[it.type] = {priced:0, unpriced:0};
      var a = amountOf(it);
      if(!a){ counts[it.type].unpriced++; return; }
      counts[it.type].priced++;

      if(!curs[a.cur]){ curs[a.cur] = {total:0, types:{}}; curOrder.push(a.cur); }
      var c = curs[a.cur];
      c.total += a.n;
      if(!c.types[it.type]) c.types[it.type] = {total:0, subs:{}, subOrder:[]};
      var t = c.types[it.type];
      t.total += a.n;
      var sl = subLabel(it.type, it.subtype) || 'Not specified';
      if(t.subs[sl] == null){ t.subs[sl] = 0; t.subOrder.push(sl); }
      t.subs[sl] += a.n;
    });

    curOrder.sort(function(a, b){ return curs[b].total - curs[a].total; });
    return {curs:curs, curOrder:curOrder, order:order, counts:counts};
  }

  /* Everything converted into SEK, by type and subtype. Any currency without a
     rate is left out entirely and reported, never silently treated as zero. */
  function homeRollup(){
    var types = {}, order = [], total = 0, missing = [];
    state.items.forEach(function(it){
      var a = amountOf(it);
      if(!a) return;
      var v = toHome(a.n, a.cur);
      if(v == null){
        if(missing.indexOf(a.cur) === -1) missing.push(a.cur);
        return;
      }
      total += v;
      if(!types[it.type]){ types[it.type] = {total:0, subs:{}, subOrder:[]}; order.push(it.type); }
      var t = types[it.type];
      t.total += v;
      var sl = subLabel(it.type, it.subtype) || 'Not specified';
      if(t.subs[sl] == null){ t.subs[sl] = 0; t.subOrder.push(sl); }
      t.subs[sl] += v;
    });
    return {types:types, total:total, missing:missing};
  }

  function renderRates(inUse){
    var others = inUse.filter(function(c){ return c && c !== HOME_CUR; });
    if(!others.length) return '';
    var html = '<div class="rates"><div class="rates-head">Conversion rates</div><div class="rates-grid">';
    others.forEach(function(cur){
      var val = (state.rates || {})[cur] || '';
      var r = rateFor(cur);
      html += '<span class="rate-cur">' + esc(cur) + '</span>';
      html += canEdit
        ? '<input type="text" inputmode="decimal" class="rate-in" data-act="rate" data-cur="' + esc(cur) +
          '" value="' + esc(val) + '" placeholder="0" aria-label="' + esc(cur) + ' per 1 ' + HOME_CUR + '">'
        : '<span class="rate-ro">' + esc(val || 'not set') + '</span>';
      html += '<span class="rate-per">per 1 ' + HOME_CUR + '</span>';
      /* Pick a round sample big enough that the answer is not just "1". */
      var eg = '';
      if(r){
        var base = 1;
        while(base / r < 10 && base < 1e7) base *= 10;
        eg = fmtAmount(base) + ' ' + cur + ' = ' + fmtAmount(Math.round(base / r)) + ' ' + HOME_CUR;
      }
      html += '<span class="rate-eg">' + esc(eg) + '</span>';
    });
    html += '</div><p class="rates-note">Typed in by you and stored with the trip. Nothing is looked up, so they are only as current as you make them.</p></div>';
    return html;
  }

  function renderBudget(){
    var b = budgetData();
    var priced = pricedCount();
    var costable = state.items.filter(function(i){ return moneyField(i.type); }).length;

    if(!priced){
      return '<div class="empty"><h2>Nothing costed yet</h2>' +
             '<p>Put a cost on a flight, stay, journey, activity or meal and it is totalled here, ' +
             'broken down by type and by the detail underneath it.</p></div>';
    }

    var html = '<div class="card-sum">' + priced + ' of ' + costable + ' costable entries priced' +
               (priced < costable ? '  ·  totals are a floor, not a final figure' : '') + '</div>';

    /* Unpriced entries belong to no currency, so they are listed once here
       rather than repeated inside every currency card. */
    var tabOf = {};
    TABS.forEach(function(t){ if(t.type) tabOf[t.type] = t.label; });
    var gaps = b.order.filter(function(tid){ return (b.counts[tid] || {}).unpriced; })
                      .map(function(tid){ return b.counts[tid].unpriced + ' in ' + (tabOf[tid] || TYPE_MAP[tid].label); });
    if(gaps.length){
      html += '<div class="bud-gaps">' + ICON.info + '<div>Still without a cost: ' + esc(gaps.join(', ')) +
              '. Those are missing from every total below.</div></div>';
    }

    html += renderRates(b.curOrder);

    /* The combined view, when at least one rate makes conversion possible. */
    var home = homeRollup();
    if(home.total > 0 && b.curOrder.filter(function(c){ return c && c !== HOME_CUR; }).length){
      html += '<article class="card budget budget-home">';
      html +=   '<div class="bud-head">' +
                  '<span class="bud-cur">Everything in ' + HOME_CUR + '</span>' +
                  '<span class="bud-total">' + esc(fmtAmount(Math.round(home.total))) + '</span>' +
                '</div>';
      if(home.missing.length){
        html += '<div class="bud-warn">No rate for ' + esc(home.missing.join(', ')) +
                ', so nothing in ' + (home.missing.length === 1 ? 'it is' : 'them is') + ' counted here.</div>';
      }
      b.order.forEach(function(tid){
        var t = home.types[tid];
        if(!t) return;
        var pct = home.total ? (t.total / home.total * 100) : 0;
        html += '<div class="bud-block">';
        html +=   '<div class="bud-row">' +
                    '<span class="bud-name">' + esc(TYPE_MAP[tid].label) + '</span>' +
                    '<span class="bud-amt">' + esc(fmtAmount(Math.round(t.total))) + '</span>' +
                    '<span class="bud-pct">' + Math.round(pct) + '%</span>' +
                  '</div>';
        html +=   '<div class="bud-meter" role="img" aria-label="' + Math.round(pct) + ' percent of the total">' +
                    '<span style="width:' + pct.toFixed(1) + '%"></span></div>';
        html +=   '<div class="bud-subs">' + t.subOrder.slice().sort(function(x, y){
                    return t.subs[y] - t.subs[x];
                  }).map(function(s){
                    return '<span class="bud-sub-name">' + esc(s) + '</span>' +
                           '<span class="bud-sub-amt">' + esc(fmtAmount(Math.round(t.subs[s]))) + '</span>';
                  }).join('') + '</div>';
        html += '</div>';
      });
      html += '</article>';
    }

    html += '<div class="cards">';

    b.curOrder.forEach(function(cur){
      var c = b.curs[cur];
      var inHome = toHome(c.total, cur);
      html += '<article class="card budget">';
      html +=   '<div class="bud-head">' +
                  '<span class="bud-cur">' + esc(cur || 'No currency set') +
                    (inHome != null && cur !== HOME_CUR
                      ? '<span class="bud-conv">' + esc(fmtAmount(Math.round(inHome))) + ' ' + HOME_CUR + '</span>'
                      : '') +
                  '</span>' +
                  '<span class="bud-total">' + esc(fmtAmount(c.total)) + '</span>' +
                '</div>';

      b.order.forEach(function(tid){
        var t = c.types[tid];
        if(!t) return;
        var pct = c.total ? (t.total / c.total * 100) : 0;
        var miss = (b.counts[tid] || {}).unpriced || 0;
        html += '<div class="bud-block">';
        html +=   '<div class="bud-row">' +
                    '<span class="bud-name">' + esc(TYPE_MAP[tid].label) + '</span>' +
                    '<span class="bud-amt">' + esc(fmtAmount(t.total)) + '</span>' +
                    '<span class="bud-pct">' + Math.round(pct) + '%</span>' +
                  '</div>';
        html +=   '<div class="bud-meter" role="img" aria-label="' + Math.round(pct) +
                  ' percent of the ' + esc(cur) + ' total">' +
                    '<span style="width:' + pct.toFixed(1) + '%"></span></div>';
        if(t.subOrder.length > 1 || t.subOrder[0] !== 'Not specified'){
          html += '<div class="bud-subs">' + t.subOrder.slice().sort(function(x, y){
                    return t.subs[y] - t.subs[x];
                  }).map(function(s){
                    return '<span class="bud-sub-name">' + esc(s) + '</span>' +
                           '<span class="bud-sub-amt">' + esc(fmtAmount(t.subs[s])) + '</span>';
                  }).join('') + '</div>';
        }
        html += '</div>';
      });

      html += '</article>';
    });

    return html + '</div>';
  }

  function openIn(listId){
    return (state.lists[listId] || []).filter(function(i){ return !i.done; }).length;
  }

  /* Ticked rows drop to the foot of their section, keeping the order of
     everything else, so what is left to do stays together at the top. */
  function openFirst(arr){
    return arr.filter(function(i){ return !i.done; })
              .concat(arr.filter(function(i){ return i.done; }));
  }

  function renderList(l){
    var items = state.lists[l.id] || [];
    var left = items.filter(function(i){ return !i.done; }).length;

    var sum;
    if(!items.length) sum = l.empty;
    else if(!left)    sum = 'All ' + items.length + ' done';
    else              sum = left + ' of ' + items.length + ' ' + l.verb;

    var html = '<div class="card-sum">' + esc(sum) + '</div>';
    html += '<div class="prep"><section class="prep-col">';

    if(items.length && l.cats){
      /* Only categories that actually hold something get a heading, with
         anything untagged collected at the end. */
      var groups = l.cats.map(function(c){
        return {label:c.label, items: openFirst(items.filter(function(i){ return i.cat === c.id; }))};
      }).filter(function(g){ return g.items.length; });
      var loose = openFirst(items.filter(function(i){ return !i.cat; }));
      if(loose.length) groups.push({label:'Not sorted', items:loose});

      groups.forEach(function(g){
        var gl = g.items.filter(function(i){ return !i.done; }).length;
        html += '<div class="pack-group">';
        html +=   '<h3 class="pack-head">' + esc(g.label) +
                  '<span class="pack-count">' + (gl ? gl + ' left' : 'done') + '</span></h3>';
        html +=   '<ul class="prep-list">' + g.items.map(function(it){ return listRow(l, it); }).join('') + '</ul>';
        html += '</div>';
      });
    } else if(items.length){
      html += '<ul class="prep-list">' + openFirst(items).map(function(it){ return listRow(l, it); }).join('') + '</ul>';
    }

    if(!canEdit && !items.length){
      html += '<p class="prep-empty">Nothing here yet.</p>';
    }

    return html + '</section></div>';
  }

  /* The add row for a list. It is rendered into the toolbar above the list
     rather than under it, so adding does not mean scrolling past everything. */
  function listAddForm(l){
    return '<form class="prep-add in-bar" data-list="' + esc(l.id) + '">' +
             '<input type="text" placeholder="' + esc(l.placeholder) + '"' +
               ' aria-label="Add to ' + esc(l.label) + '" autocomplete="off">' +
             (l.cats ? '<select class="prep-cat" aria-label="Category">' +
               l.cats.map(function(c){
                 return '<option value="' + esc(c.id) + '"' +
                        (c.id === lastCat[l.id] ? ' selected' : '') + '>' + esc(c.label) + '</option>';
               }).join('') + '</select>' : '') +
             '<button class="btn" type="submit">Add</button>' +
           '</form>';
  }

  function listRow(l, it){
    var cid = 'li-' + it.id;
    var s = '<li class="prep-item' + (it.done ? ' is-done' : '') + '">' +
              '<input type="checkbox" id="' + esc(cid) + '" data-act="tick"' +
                ' data-list="' + esc(l.id) + '" data-id="' + esc(it.id) + '"' +
                (it.done ? ' checked' : '') + (canEdit ? '' : ' disabled') +
                (canEdit ? ' aria-label="' + esc(it.text) + '"' : '') + '>';
    /* An editor types straight into the row. A viewer gets a plain label, which
       also keeps the click-the-text-to-tick behaviour they expect. */
    if(canEdit){
      s +=      '<span class="prep-text" contenteditable="plaintext-only" spellcheck="false"' +
                  ' data-act="edit-item" data-list="' + esc(l.id) + '" data-id="' + esc(it.id) + '"' +
                  ' role="textbox" aria-label="Edit ' + esc(it.text) + '"' +
                  ' title="Click to edit">' + esc(it.text) + '</span>';
    } else {
      s +=      '<label for="' + esc(cid) + '">' + esc(it.text) + '</label>';
    }
    if(l.cats && canEdit){
      s +=    '<span class="catpick" title="Change category">' +
                '<span class="catpick-text">' +
                  esc(it.cat && l.catMap[it.cat] ? l.catMap[it.cat].label : 'Not sorted') + '</span>' +
                '<select data-act="setcat" data-list="' + esc(l.id) + '" data-id="' + esc(it.id) + '"' +
                  ' aria-label="Category for ' + esc(it.text) + '">' +
                  '<option value=""' + (it.cat ? '' : ' selected') + '>Not sorted</option>' +
                  l.cats.map(function(c){
                    return '<option value="' + esc(c.id) + '"' + (c.id === it.cat ? ' selected' : '') +
                           '>' + esc(c.label) + '</option>';
                  }).join('') +
                '</select>' +
              '</span>';
    }
    if(canEdit){
      s +=    '<button class="btn btn-ghost" data-act="rm-item" data-list="' + esc(l.id) +
              '" data-id="' + esc(it.id) + '" aria-label="Remove ' + esc(it.text) + '">' +
              ICON.trash + '</button>';
    }
    return s + '</li>';
  }

  function applyPalette(){
    document.documentElement.setAttribute('data-palette', state.trip.theme);
  }

  function render(){
    applyPalette();
    var g = grouped();
    var zones = zonesInUse();
    var showZones = zones.length > 1;
    var days = g.length;
    var app = document.getElementById('app');

    var range = '';
    var withDates = sorted().filter(function(i){ return i.date; });
    if(withDates.length){
      var a = longDate(withDates[0].date);
      var b = longDate(withDates[withDates.length-1].date);
      range = a === b ? a : a + ' to ' + b;
    }

    var html = '';

    html += '<div class="mast">';
    html +=   '<div class="mast-eyebrow">Itinerary</div>';
    html +=   '<h1 class="mast-title" id="trip-name"' + (canEdit ? ' contenteditable="plaintext-only" spellcheck="false"' : '') + '>' + esc(state.trip.name) + '</h1>';
    /* The countdown is only interesting while there is something to count
       down to, so it goes away the day the trip starts. */
    var status = tripStatus();
    if(status && status.phase === 'before'){
      html +=  '<span class="mast-status s-' + status.phase + '">' + esc(status.text) + '</span>';
    }
    html +=   '<div class="mast-meta">';
    if(range) html += '<span><b>' + esc(range) + '</b></span>';
    html +=     '<span>' + days + ' ' + (days === 1 ? 'day' : 'days') + '</span>';
    html +=     '<span>' + state.items.length + ' ' + (state.items.length === 1 ? 'entry' : 'entries') + '</span>';
    /* With several zones the per-entry labels already say it; only the
       single-zone case needs stating, since nothing else shows it. */
    if(zones.length === 1){
      html +=   '<span>All times <b>' + esc(zoneLabel(zones[0], withDates.length ? withDates[0].date : '')) + '</b></span>';
    }
    html +=   '</div>';
    html += '</div>';

    if(canEdit){
    html += '<div class="tabwrap" id="tabwrap">';
    html += '<div class="tabs" role="tablist" id="tabstrip">';
    TABS.forEach(function(t){
      var on = activeTab === t.id;
      var n;
      if(t.budget) n = pricedCount();
      else if(t.list) n = openIn(t.list);
      else if(t.type) n = state.items.filter(function(i){ return i.type === t.type; }).length;
      else n = state.items.length;
      html += '<button class="tab" role="tab" data-act="tab" data-tab="' + t.id + '"' +
              ' aria-selected="' + on + '">' + esc(t.label) +
              '<span class="tab-count">' + n + '</span></button>';
    });
    html += '</div>';
    html += '<button class="tabnav tn-l" data-act="tabscroll" data-dir="-1" tabindex="-1"' +
            ' aria-label="Scroll tabs left">' + ICON.chevL + '</button>';
    html += '<button class="tabnav tn-r" data-act="tabscroll" data-dir="1" tabindex="-1"' +
            ' aria-label="Scroll tabs right">' + ICON.chevR + '</button>';
    html += '</div>';
    }

    /* Family get the itinerary and nothing else, so a viewer is always on it. */
    if(!canEdit) activeTab = 'itinerary';
    var tab = TABS.filter(function(t){ return t.id === activeTab; })[0];
    /* On a list tab the toolbar carries that list's add row instead of the
       buttons for itinerary entries, which have nothing to do there. */
    var barList = tab && tab.list ? LIST_MAP[tab.list] : null;
    var onItinerary = !tab || tab.id === 'itinerary';
    html += '<div class="bar' + (barList ? ' bar-list' : '') + '">';
    if(canEdit && barList){
      html += listAddForm(barList);
    } else if(canEdit){
      html += '<button class="btn btn-primary" data-act="new">' + ICON.plus + 'Add entry</button>';
      if(state.items.some(function(i){ return /^seed-/.test(i.id); })){
        html += '<button class="btn" data-act="clear-seed">Clear the examples</button>';
      }
      /* Sharing is about the itinerary family are given, so it lives there. */
      if(onItinerary) html += '<button class="btn" data-act="sharing">' + ICON.share + 'Sharing</button>';
    } else if(previewing){
      html += '<button class="btn btn-primary" data-act="endpreview">' + ICON.unlock + 'Back to editing</button>';
      html += '<span class="preview-flag">Viewing as family</span>';
    } else {
      html += '<button class="btn btn-primary" data-act="unlock">' + ICON.unlock + 'Edit this itinerary</button>';
    }
    html += '<span class="bar-spacer"></span>';
    if(canEdit){
      html += '<div class="palettes" role="group" aria-label="Colour theme">';
      html +=   '<span class="palettes-label">Theme</span>';
      PALETTES.forEach(function(p){
        var on = state.trip.theme === p.id;
        html += '<button class="sw sw-' + p.id + '" data-act="palette" data-p="' + p.id + '"' +
                ' aria-pressed="' + on + '" title="' + esc(p.label) + '" aria-label="' + esc(p.label) + '"></button>';
      });
      html += '</div>';
      if(onItinerary){
        html += '<button class="btn btn-ghost" data-act="lock" title="See what family sees">Preview as viewer</button>';
      }
    }
    html += '</div>';

    if(!canEdit){
      html += '<div class="ro-note">' + ICON.info +
              '<div><b>View only.</b> This itinerary is read only here, so nothing you do can change it. ' +
              'If it is yours, choose <b>Edit this itinerary</b> and your access will be checked.</div></div>';
    }

    if(tab && tab.budget){
      html += renderBudget();
    } else if(tab && tab.list){
      html += renderList(LIST_MAP[tab.list]);
    } else if(tab && tab.type){
      html += renderOverview(tab);
    } else if(!state.items.length){
      html += '<div class="empty"><h2>Nothing on the board yet</h2><p>Add your first entry and it will appear here, grouped by day and ordered by time.</p>' +
              (canEdit ? '<button class="btn btn-primary" data-act="new">' + ICON.plus + 'Add the first entry</button>' : '') + '</div>';
    } else {
      var todayStr = todayISO();
      g.forEach(function(day){
        var d = parseDate(day.date);
        var isToday = day.date === todayStr;
        html += '<section class="day' + (isToday ? ' day-today' : '') + '"' +
                (isToday ? ' id="today"' : '') + '>';
        html +=   '<div class="day-mark">';
        if(d){
          html += '<div class="day-num">' + d.getUTCDate() + '</div>';
          html += '<div><div class="day-mon">' + MONTHS[d.getUTCMonth()] + '</div><div class="day-dow">' + DOW[d.getUTCDay()] + '</div></div>';
          if(isToday) html += '<div class="day-today-tag">Today</div>';
        } else {
          html += '<div class="day-mon">Undated</div>';
        }
        html +=   '</div>';
        html +=   '<div class="day-items">';
        day.items.forEach(function(it){
          var kind = TYPE_MAP[it.type] || TYPE_MAP.other;
          html += '<article class="entry">';
          html +=   '<div class="entry-time' + (it.time ? '' : ' none') + '">';
          if(it.time){
            var endZone = it.endTz || it.tz;
            html +=   '<span class="t-start">' + esc(it.time) + '</span>';
            if(showZones){
              html += '<span class="t-zone" title="' + esc(it.tz) + '">' + esc(zoneLabel(it.tz, it.date)) + '</span>';
            }
            if(it.endTime){
              var overnight = it.endTime < it.time && endZone === it.tz;
              html += '<span class="t-rule" aria-hidden="true"></span>';
              html += '<span class="t-end">' + esc(it.endTime) +
                      (overnight ? '<span class="t-next" title="Ends the next day">+1</span>' : '') +
                      '</span>';
              if(showZones){
                html += '<span class="t-zone" title="' + esc(endZone) + '">' + esc(zoneLabel(endZone, it.date)) + '</span>';
              }
            }
          } else {
            html +=   '<span aria-label="No set time">&mdash;</span>';
          }
          html +=   '</div>';
          html +=   '<div class="entry-body">';
          html +=     '<div class="entry-head"><h3 class="entry-title">' + esc(it.title) + '</h3>';
          if(canEdit){
            html +=   '<div class="entry-acts">' +
                        '<button class="btn btn-ghost" data-act="edit" data-id="' + esc(it.id) + '" aria-label="Edit entry">' + ICON.edit + '</button>' +
                        '<button class="btn btn-ghost" data-act="del" data-id="' + esc(it.id) + '" aria-label="Delete entry">' + ICON.trash + '</button>' +
                      '</div>';
          }
          html +=     '</div>';
          html +=     '<div class="entry-chips">';
          var sub = subLabel(it.type, it.subtype);
          html +=       '<span class="kind k-' + esc(kind.id) + '">' + typeIcon(kind) + esc(kind.label) +
                        (sub ? '<span class="kind-sub">' + esc(sub) + '</span>' : '') + '</span>';
          if(it.location){
            html +=     '<a class="pin" href="' + esc(mapsUrl(it.location)) + '" target="_blank" rel="noopener noreferrer">' + ICON.pin + '<span>' + esc(it.location) + '</span></a>';
          }
          html +=     '</div>';
          var facts = detailPairs(it);
          var inlineFacts = facts.filter(function(p){ return !p.block; });
          var blockFacts = facts.filter(function(p){ return p.block; });
          /* Fields can claim a line number; anything without one shares line 0,
             so types that never asked for structure keep their single strip. */
          var byLine = {}, lineOrder = [];
          inlineFacts.forEach(function(p){
            if(!byLine[p.line]){ byLine[p.line] = []; lineOrder.push(p.line); }
            byLine[p.line].push(p);
          });
          lineOrder.sort(function(a, b){ return a - b; });
          lineOrder.forEach(function(L){
            var group = byLine[L];
            if(group[0].aschip){
              html += '<div class="entry-chips amen-chips">' + group.map(function(p){
                        return '<span class="kind k-' + esc(p.chip) + '">' + esc(p.text) + '</span>';
                      }).join('') + '</div>';
            } else {
              html += '<div class="entry-facts">' + group.map(function(p){
                        return '<span class="fact' + (p.strong ? ' fact-strong' : '') + '" title="' + esc(p.label) + '">' +
                               (p.prefix ? '<span class="fact-k">' + esc(p.prefix) + '</span>' : '') +
                               esc(p.text) + '</span>';
                      }).join('') + '</div>';
            }
          });
          blockFacts.forEach(function(p){
            html +=   '<div class="entry-facts entry-facts-block">' +
                        (p.prefix ? '<span class="fact-k">' + esc(p.prefix) + '</span>' : '') +
                        esc(p.text) + '</div>';
          });
          if(it.notes){
            html +=   '<div class="entry-notes">' + esc(it.notes) + '</div>';
          }
          if(it.photos && it.photos.length){
            html +=   '<div class="shots">' + it.photos.map(function(p,i){
                        return '<img src="' + esc(p) + '" alt="Photo ' + (i+1) + ' for ' + esc(it.title) + '" data-act="zoom" loading="lazy">';
                      }).join('') + '</div>';
          }
          html +=   '</div>';
          html += '</article>';
        });
        html +=   '</div>';
        html += '</section>';
      });
    }

    var bytes = stateBytes();
    var pct = Math.max(1, Math.min(100, Math.round(bytes / MAX_BYTES * 100)));
    var size = bytes < 1048576 ? Math.max(1, Math.round(bytes/1024)) + ' KB' : (bytes/1048576).toFixed(1) + ' MB';
    html += '<div class="foot">';
    html +=   '<span class="meter" title="Photos are stored inside the page itself, so there is a ceiling.">Page size <span class="meter-track"><span class="meter-fill" style="width:' + pct + '%"></span></span> ' + size + ' of 15 MB</span>';
    if(zones.length > 1){
      html += '<span>Each time is local to its own zone, not converted</span>';
    }
    html += '</div>';

    app.innerHTML = html;
    wireTabStrip();

    /* On the first paint of a trip that is under way, land on today rather
       than at the top of a week that has already happened. */
    if(!jumpedToToday && activeTab === 'itinerary'){
      jumpedToToday = true;
      var el = document.getElementById('today');
      if(el){
        requestAnimationFrame(function(){
          el.scrollIntoView({block:'start', behavior:'auto'});
          window.scrollBy(0, -18);
        });
      }
    }
  }

  /* Which edges of the tab strip have more behind them. Measured, so it is
     right at any width and after any zoom or font change. */
  function paintTabOverflow(){
    var wrap = document.getElementById('tabwrap');
    var strip = document.getElementById('tabstrip');
    if(!wrap || !strip) return;
    var max = strip.scrollWidth - strip.clientWidth;
    wrap.classList.toggle('more-l', strip.scrollLeft > 2);
    wrap.classList.toggle('more-r', strip.scrollLeft < max - 2);
  }

  var tabResizeWired = false;
  function wireTabStrip(){
    var strip = document.getElementById('tabstrip');
    if(!strip) return;
    strip.addEventListener('scroll', paintTabOverflow, {passive:true});
    /* Bring the chosen tab into view without dragging the page with it. */
    var on = strip.querySelector('.tab[aria-selected="true"]');
    if(on){
      var left = on.offsetLeft, right = left + on.offsetWidth;
      if(left < strip.scrollLeft + 40) strip.scrollLeft = Math.max(0, left - 40);
      else if(right > strip.scrollLeft + strip.clientWidth - 40){
        strip.scrollLeft = right - strip.clientWidth + 40;
      }
    }
    paintTabOverflow();
    requestAnimationFrame(paintTabOverflow);   /* after fonts settle */
    if(!tabResizeWired){
      tabResizeWired = true;
      window.addEventListener('resize', paintTabOverflow);
      if(document.fonts && document.fonts.ready) document.fonts.ready.then(paintTabOverflow);
    }
  }

  /* -------------------------------------------------------------------- form */

  function openForm(id){
    editingId = id || null;

    var startTz = it ? it.tz : ((last && (last.endTz || last.tz)) || state.trip.tz);

          '<div><label for="f-photo">Photos</label><input type="file" id="f-photo" accept="image/*" multiple>' +

    document.getElementById('f-date').addEventListener('change', paintZones);
    document.getElementById('f-type').addEventListener('change', refreshTypeFields);
    document.getElementById('f-sub-wrap').addEventListener('change', refreshSubtypeFields);
    document.getElementById('f-fields-wrap').addEventListener('change', refreshConditionals);
    refreshConditionals();
    if(!TYPE_MAP[startType].subs.length) document.getElementById('f-sub-wrap').style.display = 'none';
    document.getElementById('f-photo').addEventListener('change', onPhotos);
    document.getElementById('entry-form').addEventListener('submit', onSubmit);
    document.addEventListener('keydown', escClose);
  }

  /* Zone <select>. Zones already used in this trip, plus the viewer's own, are
     pinned to the top so the common picks are reachable without scrolling. */
  function zoneSelect(id, selected, blankLabel){
    var pinned = [], seen = {};
    zonesInUse().concat([state.trip.tz, localZone(), selected]).forEach(function(z){
      if(z && validZone(z) && !seen[z]){ seen[z] = 1; pinned.push(z); }
    });
    var rest = allZones().filter(function(z){ return !seen[z]; }).sort();

    function opt(z){
      return '<option value="' + esc(z) + '"' + (z === selected ? ' selected' : '') + '>' +
             esc(zoneOptionLabel(z)) + '</option>';
    }
    var html = '<select id="' + id + '">';
    if(blankLabel){
      html += '<option value=""' + (selected ? '' : ' selected') + '>' + esc(blankLabel) + '</option>';
    }
    if(pinned.length){
      html += '<optgroup label="In this trip">' + pinned.map(opt).join('') + '</optgroup>';
    }
    html += '<optgroup label="All time zones">' + rest.map(opt).join('') + '</optgroup>';
    return html + '</select>';
  }

  /* Detail <select> for the chosen type. Rebuilt whenever Type changes. */
  function subSelect(typeId, selected){
    var t = TYPE_MAP[typeId];
    var subs = (t && t.subs) || [];
    var html = '<select id="f-sub"' + (subs.length ? '' : ' disabled') + '>';
    html += '<option value="">' + (subs.length ? 'Not specified' : 'None for this type') + '</option>';
    subs.forEach(function(s){
      html += '<option value="' + esc(s.id) + '"' + (s.id === selected ? ' selected' : '') + '>' + esc(s.label) + '</option>';
    });
    return html + '</select>';
  }

  /* Text inputs for a type's extra fields, narrowed to the ones the chosen
     subtype carries. Empty string when the type has none. */
  function fieldInputs(typeId, details, subId){
    var fs = fieldsFor(typeId).filter(function(f){
      return !f.subs || f.subs.indexOf(subId) !== -1;
    });
    if(!fs.length) return '';

    /* Consecutive fields sharing a `row` are wrapped in one full-width band
       with its own layout, so a checkbox can sit beside the inputs it governs. */
    var out = '', i = 0;
    while(i < fs.length){
      var r = fs[i].row;
      if(!r){ out += oneField(fs[i], details); i++; continue; }
      var band = '';
      while(i < fs.length && fs[i].row === r){ band += oneField(fs[i], details); i++; }
      out += '<div class="full field-row row-' + esc(r) + '">' + band + '</div>';
    }
    return out;
  }

  /* One field's control, wrapped in its own cell. */
  function oneField(f, details){
    var v = (details && details[f.id]) || '';
    var cls = [];
    if(f.full) cls.push('full');
    if(f.input === 'checkbox') cls.push('checkfield');
    var attrs = (cls.length ? ' class="' + cls.join(' ') + '"' : '') +
                (f.showIf ? ' data-showif="' + esc(f.showIf) + '"' : '');

    if(f.input === 'checkbox'){
      return '<div' + attrs + '>' +
             '<input type="checkbox" id="ff-' + esc(f.id) + '"' + (v ? ' checked' : '') + '>' +
             '<label for="ff-' + esc(f.id) + '">' + esc(f.label) + '</label></div>';
    }
    var control;
    if(f.input === 'textarea'){
      control = '<textarea id="ff-' + esc(f.id) + '" rows="2" placeholder="' + esc(f.placeholder || '') + '">' + esc(v) + '</textarea>';
    } else if(f.input === 'currency'){
      var cur = v || lastCur;
      var opts = CURRENCIES.slice();
      if(cur && opts.indexOf(cur) === -1) opts.unshift(cur);
      control = '<select id="ff-' + esc(f.id) + '">' + opts.map(function(c){
        return '<option value="' + esc(c) + '"' + (c === cur ? ' selected' : '') + '>' + esc(c) + '</option>';
      }).join('') + '</select>';
    } else if(f.input === 'money'){
      control = '<input type="text" inputmode="decimal" id="ff-' + esc(f.id) + '"' +
                ' placeholder="' + esc(f.placeholder || '') + '" value="' + esc(v) + '">';
    } else {
      control = '<input type="' + esc(f.input || 'text') + '" id="ff-' + esc(f.id) + '"' +
                ' placeholder="' + esc(f.placeholder || '') + '" value="' + esc(v) + '">';
    }
    return '<div' + attrs + '><label for="ff-' + esc(f.id) + '">' + esc(f.label) + '</label>' + control + '</div>';
  }

  /* Fields gated on a checkbox appear only while it is ticked. */
  function refreshConditionals(){
    var fw = document.getElementById('f-fields-wrap');
    if(!fw) return;
    fw.querySelectorAll('[data-showif]').forEach(function(el){
      var ctrl = document.getElementById('ff-' + el.getAttribute('data-showif'));
      el.style.display = (ctrl && ctrl.checked) ? '' : 'none';
    });
  }

  function refreshTypeFields(){
    var typeSel = document.getElementById('f-type');
    if(!typeSel) return;
    var t = TYPE_MAP[typeSel.value];

    var wrap = document.getElementById('f-sub-wrap');
    if(wrap){
      wrap.style.display = (t && t.subs.length) ? '' : 'none';
      wrap.innerHTML = '<label for="f-sub">' + esc(subFieldLabel(typeSel.value)) +
                       '</label>' + subSelect(typeSel.value, '');
    }
    var fw = document.getElementById('f-fields-wrap');
    if(fw){
      fw.innerHTML = fieldInputs(typeSel.value, null, currentSub());
      refreshConditionals();
    }
  }

  /* Live readout under the time row. It counts from departure to arrival, so
     for a flight with a connection the layover is part of the number. */
  function paintDuration(){
    var box = document.getElementById('f-dur');
    if(!box) return;
    var date  = document.getElementById('f-date').value;
    var start = document.getElementById('f-time').value;
    var end   = document.getElementById('f-end').value;
    var tz    = document.getElementById('f-tz').value;
    var etz   = document.getElementById('f-endtz').value || tz;
    var type  = document.getElementById('f-type').value;

    var min = elapsedMinutes(date, start, tz, end, etz);
    if(min == null){ box.hidden = true; box.textContent = ''; return; }

    /* One entry is one leg, so for a flight this really is time in the air. */
    var label = type === 'flight' ? 'Flight time' : 'Total time';
    var note  = (tz && etz && tz !== etz) ? ' across ' + zoneLabel(tz, date) + ' to ' + zoneLabel(etz, date) : '';
    box.hidden = false;
    box.innerHTML = '<span class="dur-k">' + esc(label) + '</span>' +
                    '<span class="dur-v">' + esc(fmtDuration(min)) + '</span>' +
                    (note ? '<span class="dur-n">' + esc(note.slice(1)) + '</span>' : '');
  }

  function currentSub(){
    var s = document.getElementById('f-sub');
    return s ? s.value : '';
  }

  /* Some fields belong to particular subtypes, so the block is rebuilt when the
     subtype changes. What is already typed in is carried over. */
  function refreshSubtypeFields(){
    var typeSel = document.getElementById('f-type');
    var fw = document.getElementById('f-fields-wrap');
    if(!typeSel || !fw) return;
    var kept = collectFields(typeSel.value);
    fw.innerHTML = fieldInputs(typeSel.value, kept, currentSub());
    refreshConditionals();
  }

  /* A compact control showing just the abbreviation (CET, GMT+8). The real
     <select> sits transparently on top, so opening it gives the native picker
     with full zone names while the closed state stays small. */
  function zonePicker(id, selected, blankLabel){
    return '<span class="zonepick">' +
             '<span class="zonepick-text" id="' + esc(id) + '-text"></span>' +
             zoneSelect(id, selected, blankLabel) +
           '</span>';
  }

  function paintZone(id, blankShort){
    var sel = document.getElementById(id);
    var txt = document.getElementById(id + '-text');
    if(!sel || !txt) return;
    var dateEl = document.getElementById('f-date');
    var iso = dateEl ? dateEl.value : '';
    if(sel.value){
      txt.textContent = zoneLabel(sel.value, iso);
      txt.classList.remove('zonepick-blank');
    } else {
      txt.textContent = blankShort;
      txt.classList.add('zonepick-blank');
    }
    txt.parentNode.setAttribute('title', sel.value || blankShort);
  }

  function paintZones(){
    paintZone('f-tz', '');
    paintZone('f-endtz', 'same');
  }

  function escClose(e){ if(e.key === 'Escape') closeForm(); }

  function closeForm(){
    var bg = document.getElementById('sheet-bg');
    if(bg) bg.remove();
    document.removeEventListener('keydown', escClose);
    editingId = null;
    draftPhotos = [];
  }

  function drawThumbs(){
    var box = document.getElementById('f-thumbs');
    if(!box) return;
    box.innerHTML = draftPhotos.map(function(p,i){
      return '<div class="thumb"><img src="' + esc(p) + '" alt="Attached photo ' + (i+1) + '">' +
             '<button type="button" data-rm="' + i + '" aria-label="Remove photo ' + (i+1) + '">&times;</button></div>';
    }).join('');
    box.querySelectorAll('[data-rm]').forEach(function(b){
      b.addEventListener('click', function(){
        draftPhotos.splice(+b.getAttribute('data-rm'), 1);
        drawThumbs();
      });
    });
  }

  function shrink(file){
    return new Promise(function(resolve, reject){
      var fr = new FileReader();
      fr.onload = function(){
        var img = new Image();
        img.onload = function(){
          var max = 1100, w = img.naturalWidth, h = img.naturalHeight;
          if(w > max || h > max){
            var s = max / Math.max(w, h);
            w = Math.round(w * s); h = Math.round(h * s);
          }
          var c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', 0.72));
        };
        img.onerror = function(){ reject(new Error('That file did not open as an image')); };
        img.src = fr.result;
      };
      fr.onerror = function(){ reject(new Error('That file could not be read')); };
      fr.readAsDataURL(file);
    });
  }

  function onPhotos(e){
    var files = Array.prototype.slice.call(e.target.files || []);
    e.target.value = '';
    if(!files.length) return;
    Promise.all(files.map(shrink)).then(function(urls){
      draftPhotos = draftPhotos.concat(urls);
      drawThumbs();
    }).catch(function(err){
      toast(err.message, true);
    });
  }

  function collectFields(typeId){
    var out = {};
    fieldsFor(typeId).forEach(function(f){
      var el = document.getElementById('ff-' + f.id);
      if(!el) return;
      /* A field gated on an unticked checkbox is not saved at all. */
      if(f.showIf){
        var ctrl = document.getElementById('ff-' + f.showIf);
        if(!ctrl || !ctrl.checked) return;
      }
      if(f.input === 'checkbox'){
        if(el.checked) out[f.id] = 'yes';
        return;
      }
      var v = el.value.trim();
      if(f.input === 'money'){
        /* accept 1 200,50 or 1200.50 and store one plain number */
        var n = parseFloat(v.replace(/\s/g, '').replace(',', '.'));
        out[f.id] = isFinite(n) ? String(n) : '';
        if(!out[f.id]) delete out[f.id];
        return;
      }
      if(f.input === 'currency'){
        if(v) lastCur = v;
        return;   /* only kept when there is an amount, handled below */
      }
      if(v) out[f.id] = v;
    });
    /* A currency only means something next to an amount. */
    fieldsFor(typeId).forEach(function(f){
      if(!f.money) return;
      var curEl = document.getElementById('ff-' + f.curField);
      if(out[f.id] && curEl && curEl.value) out[f.curField] = curEl.value;
      else delete out[f.curField];
    });
    return out;
  }

  function onSubmit(e){
    e.preventDefault();
    var title = document.getElementById('f-title').value.trim();
    if(!title){ toast('Give the entry a name first', true); return; }

    var start = document.getElementById('f-time').value;
    var end = document.getElementById('f-end').value;
    if(end && !start){
      toast('An end time needs a start time to go with it', true);
      return;
    }

    var typeVal = document.getElementById('f-type').value;
    if(!TYPE_MAP[typeVal]) typeVal = 'other';
    var subEl = document.getElementById('f-sub');
    var subVal = subEl ? subEl.value : '';

    var tz = document.getElementById('f-tz').value;
    var endTz = document.getElementById('f-endtz').value;
    if(!validZone(tz)) tz = state.trip.tz;
    if(endTz === tz || !validZone(endTz)) endTz = '';

    var next = {
      id: editingId || uid(),
      date: document.getElementById('f-date').value,
      time: start,
      endTime: end,
      tz: tz,
      endTz: endTz,
      type: typeVal,
      subtype: subLabel(typeVal, subVal) ? subVal : '',
      details: collectFields(typeVal),
      title: title,
      location: document.getElementById('f-loc').value.trim(),
      notes: document.getElementById('f-notes').value.trim(),
      photos: draftPhotos.slice()
    };

    var before = state.items.slice();
    if(editingId){
      state.items = state.items.map(function(i){ return i.id === editingId ? next : i; });
    } else {
      state.items.push(next);
    }

    if(stateBytes() > MAX_BYTES){
      state.items = before;
      toast('That would push the page past its size limit. Remove a photo and try again.', true);
      return;
    }

    var msg = editingId ? 'Entry updated' : 'Added to the itinerary';
    closeForm();
    render();
    save(function(){ state.items = before; }, msg);
  }

  /* ------------------------------------------------------------- persistence */

  function buildDocument(){
    var clone = document.documentElement.cloneNode(true);
    clone.removeAttribute('data-theme');
    clone.setAttribute('data-palette', state.trip.theme);
    clone.removeAttribute('class');
    clone.removeAttribute('style');
    var b = clone.querySelector('body');
    if(b){
      b.removeAttribute('class');
      b.removeAttribute('style');
      b.removeAttribute('data-palette');
    }
    var a = clone.querySelector('#app');
    if(a) a.innerHTML = '';
    var t = clone.querySelector('#toast');
    if(t) t.innerHTML = '';
    var sheet = clone.querySelector('#sheet-bg');
    if(sheet) sheet.remove();
    var lb = clone.querySelector('#lightbox');
    if(lb) lb.remove();
    var s = clone.querySelector('#trip-state');
    if(s) s.textContent = '\n' + JSON.stringify(state, null, 2) + '\n';
    return '<!doctype html>\n' + clone.outerHTML;
  }

  /* Ask the server whether this viewer may write, by attempting one publish of
     the state exactly as it stands. Only ever runs on a deliberate click. */
  function tryUnlock(){
    if(probing) return;
    var api = (typeof claude !== 'undefined' && claude && typeof claude.use === 'function') ? claude : null;
    if(!api){
      toast('Access cannot be checked here. Open the itinerary from its own page.', true);
      return;
    }
    probing = true;
    toast('Checking your access');
    api.use('artifact').then(function(artifact){
      if(!artifact){
        probing = false;
        toast('Access cannot be checked here. Open the itinerary from its own page.', true);
        return;
      }
      return artifact.publish(buildDocument()).then(function(){
        probing = false;
        canEdit = true;
        rememberEditor(true);
        activeTab = lastTab();   /* back to whatever tab they were working in */
        render();
        toast('Editing unlocked on this device');
      }, function(err){
        probing = false;
        var code = (err && (err.code || err.name)) || '';
        if(code === 'not_granted' || code === 'not_writer'){
          rememberEditor(false);
          toast('You have view access to this itinerary, so it stays read only.', true);
          return;
        }
        if(code === 'conflict'){
          toast('A newer version was saved elsewhere. This page is reloading to it.', true);
          return;
        }
        toast('Could not check your access. Try again in a moment.', true);
      });
    }).catch(function(){
      probing = false;
      toast('Could not check your access. Try again in a moment.', true);
    });
  }

  function slug(){
    return (state.trip.name || 'trip').toLowerCase()
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'trip';
  }

  function offerDownload(filename, data){
    var api = (typeof claude !== 'undefined' && claude && typeof claude.use === 'function') ? claude : null;
    if(!api){ toast('Downloads are not available in this view.', true); return; }
    api.use('downloads').then(function(dl){
      if(!dl){ toast('Downloads are not available in this view.', true); return; }
      return dl.save({filename: filename, data: data}).then(function(){
        toast('Saved ' + filename);
      }, function(err){
        var code = (err && err.code) || 'unavailable';
        if(code === 'declined') return;                 /* never retry a no */
        if(code === 'extension_not_enabled'){
          toast('This view cannot save .html files. The data file still works.', true);
          return;
        }
        if(code === 'too_large'){ toast('That file is too big to save here.', true); return; }
        if(code === 'rate_limited'){ toast('One download at a time. Try again in a moment.', true); return; }
        toast('That did not save. Try again in a moment.', true);
      });
    }).catch(function(){ toast('That did not save. Try again in a moment.', true); });
  }
